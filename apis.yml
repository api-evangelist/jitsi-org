description: >-
  Jitsi is a collection of free and open-source projects for secure, simple, and
  scalable real-time video conferencing, maintained by 8x8. The Jitsi stack
  combines a browser-based meeting application (Jitsi Meet), a WebRTC selective
  forwarding unit (Jitsi Videobridge), conference focus (Jicofo), SIP gateway
  (Jigasi), and broadcasting infrastructure (Jibri), along with web, mobile,
  desktop, and low-level SDKs for embedding meetings into other applications.
  Jitsi is also available as a fully managed offering — Jitsi as a Service
  (JaaS) — that exposes the same conferencing surface through a JWT-secured API
  and the Jitsi IFrame/External API.
apis:
- aid: jitsi:jitsi-meet-iframe-api
  name: Jitsi Meet IFrame (External) API
  tags:
  - IFrame
  - External API
  - Embedding
  - Video Conferencing
  - JavaScript
  humanURL: https://jitsi.github.io/handbook/docs/dev-guide/dev-guide-iframe
  properties:
  - url: https://jitsi.github.io/handbook/docs/dev-guide/dev-guide-iframe
    type: Documentation
  - url: https://jitsi.github.io/handbook/docs/dev-guide/dev-guide-iframe-functions
    name: IFrame API Functions
    type: Documentation
  - url: https://jitsi.github.io/handbook/docs/dev-guide/dev-guide-iframe-events
    name: IFrame API Events
    type: Documentation
  - url: https://jitsi.github.io/handbook/docs/dev-guide/dev-guide-iframe-commands
    name: IFrame API Commands
    type: Documentation
  - url: https://github.com/jitsi/jitsi-meet/blob/master/modules/API/external/external_api.js
    name: external_api.js source
    type: SourceCode
  description: >-
    Browser-side JavaScript API (also called the External API) that embeds a
    Jitsi Meet conference into any web page through an iframe. Exposes the
    JitsiMeetExternalAPI constructor with commands (executeCommand), functions
    (getParticipantsInfo, isVideoMuted, etc.), and an event surface
    (videoConferenceJoined, participantJoined, audioMuteStatusChanged, raise
    hand, breakout rooms) for controlling the meeting from the host page. The
    same library powers the embed experience on meet.jit.si, self-hosted
    deployments, and JaaS.
- aid: jitsi:lib-jitsi-meet-api
  name: lib-jitsi-meet (Low-Level JavaScript API)
  tags:
  - JavaScript
  - WebRTC
  - Low-Level
  - Custom UI
  humanURL: https://jitsi.github.io/handbook/docs/dev-guide/dev-guide-ljm-api
  properties:
  - url: https://jitsi.github.io/handbook/docs/dev-guide/dev-guide-ljm-api
    type: Documentation
  - url: https://github.com/jitsi/lib-jitsi-meet
    type: SourceCode
  - url: https://www.npmjs.com/package/lib-jitsi-meet
    name: lib-jitsi-meet (npm)
    type: SDK
  description: >-
    Low-level JavaScript library for building entirely custom video conferencing
    experiences on top of the Jitsi infrastructure. Exposes JitsiConnection,
    JitsiConference, JitsiTrack, and the XMPP/Colibri signaling primitives that
    Jitsi Meet itself uses, allowing developers to bypass the default UI and
    embed Jitsi conferencing directly inside their own application.
- aid: jitsi:jitsi-videobridge-rest-api
  name: Jitsi Videobridge REST API
  tags:
  - Videobridge
  - SFU
  - REST
  - Self-Hosted
  - Operations
  humanURL: https://github.com/jitsi/jitsi-videobridge/blob/master/doc/rest.md
  baseURL: http://localhost:8080
  properties:
  - url: https://github.com/jitsi/jitsi-videobridge/blob/master/doc/rest.md
    name: Videobridge REST API
    type: Documentation
  - url: https://github.com/jitsi/jitsi-videobridge/blob/master/doc/statistics.md
    name: Videobridge Statistics
    type: Documentation
  - url: https://github.com/jitsi/jitsi-videobridge
    type: SourceCode
  description: >-
    Administrative HTTP API exposed by Jitsi Videobridge for operators to read
    bridge state, list active conferences, inspect endpoints, gracefully drain
    a bridge, and scrape Prometheus metrics. Typically bound to the private
    network on port 8080 with paths like /colibri/conferences, /colibri/stats,
    /colibri/debug, /colibri/shutdown, and /metrics. Not a user-facing API —
    used by Jicofo, autoscalers, and monitoring stacks.
- aid: jitsi:jicofo-rest-api
