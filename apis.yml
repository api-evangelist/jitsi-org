    name: Jibri HTTP API
    type: Documentation
  - url: https://github.com/jitsi/jibri
    type: SourceCode
  description: >-
    HTTP control API exposed by Jibri (Jitsi BRoadcasting Infrastructure) for
    starting and stopping recording or live-streaming sessions, reporting
    health, and surfacing the busy/idle state of a Jibri instance. Used by
    Jicofo and orchestrators when fanning recording or RTMP streaming load
    across a Jibri pool.
