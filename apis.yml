  description: >-
    Managed Jitsi as a Service offering from 8x8 that fronts the open-source
    Jitsi stack with a JWT-secured REST surface for issuing meeting tokens,
    managing rooms, fetching recordings, controlling participants, and
    retrieving usage. JaaS uses RS256 JSON Web Tokens signed with a
    tenant-specific API key/private key pair generated through the JaaS
    console at jaas.8x8.vc.
- aid: jitsi:jaas-iframe-api
  name: JaaS IFrame API
  tags:
  - JaaS
  - 8x8
  - IFrame
  - Embedding
  - JWT
  humanURL: https://developer.8x8.com/jaas/docs/iframe-api-jaas
  properties:
  - url: https://developer.8x8.com/jaas/docs/iframe-api-jaas
    name: JaaS IFrame API
    type: Documentation
  - url: https://developer.8x8.com/jaas/docs/jwt-overview
    name: JWT Overview
    type: Authentication
  description: >-
    JaaS-flavoured IFrame API that loads external_api.js from 8x8-vc.com (the
    managed Jitsi domain) and authenticates each meeting with a signed JWT
    issued for the tenant. Provides the same JitsiMeetExternalAPI commands,
    functions, and events as the open-source IFrame API, plus JaaS-specific
    moderator/participant claims and branding controls.
