  - url: https://github.com/jitsi/jicofo
    type: SourceCode
  description: >-
    Operations REST API exposed by Jicofo (Jitsi Conference Focus) for
    inspecting in-progress conferences, listing the bridge selection state, and
    triggering graceful shutdowns. Used by operators and orchestrators when
    running self-hosted Jitsi deployments at scale.
- aid: jitsi:jibri-rest-api
  name: Jibri REST API
  tags:
  - Jibri
  - Recording
  - Live Streaming
